name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build instrumenter and run native behavior tests
        run: |
          python3 -m json.tool contracts/code-execution.v1.schema.json > /dev/null
          python3 backend/algorithm-visualizer/instrumentation/generate_supported_types.py --check
          docker compose -f docker-compose.prod.yml --profile tools build runner
      - name: Backend contract and Docker integration tests
        run: ./mvnw test
        working-directory: backend/algorithm-visualizer

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/algorithm-visualizer/package-lock.json
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: Install dependencies
        run: npm ci
        working-directory: frontend/algorithm-visualizer
      - name: Frontend behavior tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: frontend/algorithm-visualizer
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Production build
        run: npm run build
        working-directory: frontend/algorithm-visualizer
