<div class="visualizer-layout">
  <div class="graph-draw" #graphContainer>
    @if (hoveredNodeTooltip; as tooltip) {
      <aside class="graph-node-tooltip" [style.left.px]="tooltip.left" [style.top.px]="tooltip.top">
        <strong>{{ tooltip.title }}</strong>
        <code class="tooltip-path">{{ tooltip.path }}</code>
        <div class="tooltip-value-tree">
          <app-json-value-tree [node]="tooltip.tree"></app-json-value-tree>
        </div>
      </aside>
    }
  </div>

  @if (selectedValueTree; as selectedTree) {
    <aside class="structured-inspector" aria-label="Structured value details">
      <header class="inspector-header">
        <div>
          <strong>Value details</strong>
          <code>{{ selectedTree.path }}</code>
        </div>
        <button type="button" aria-label="Close value details" (click)="closeSelectedValue()">×</button>
      </header>
      <div class="inspector-tree">
        <app-json-value-tree [node]="selectedTree"></app-json-value-tree>
      </div>
    </aside>
  }
</div>
